name: M2 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev mariadb-server mariadb-client redis-server
          sudo service mariadb start 2>/dev/null || sudo mysqld --user=root --datadir=/var/lib/mysql &
          sudo service redis-server start 2>/dev/null || sudo redis-server --daemonize yes
          sleep 5
          sudo mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'test'; FLUSH PRIVILEGES;" 2>/dev/null || true

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"

      - name: Set up bench
        run: |
          set -euo pipefail
          pip install -q "frappe-bench==5.31.0"
          bench init --skip-redis-config-generation fde_bench
          rm -rf fde_bench/apps/frappe
          git clone https://github.com/frappe/frappe.git fde_bench/apps/frappe
          cd fde_bench/apps/frappe && git checkout 012667b9c4e7f66d5e1ff5858d2e922331d4300a
          cd "$GITHUB_WORKSPACE"
          pip install -q -e fde_bench/apps/frappe
          fde_bench/env/bin/python -m pip install -q whoosh pytest
          cp -r fde_component fde_bench/apps/fde_component
          printf 'FDE Component\n' > fde_bench/apps/fde_component/modules.txt
          fde_bench/env/bin/python -m pip install -e fde_bench/apps/fde_component

          # Python 3.14 compatibility patch
          python3 "$GITHUB_WORKSPACE/.github/scripts/py314_patch.py"

          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -ptest --silent && break
            sleep 2
          done

          cd fde_bench
          mkdir -p sites logs test.localhost/logs
          printf "frappe\nfde_component\n" > sites/apps.txt
          bench new-site test.localhost --mariadb-root-password test --admin-password admin --force
          bench --site test.localhost install-app fde_component

          # Fix module resolution - write script to file
          printf '%s\n' \
            "import frappe" \
            "frappe.init(site='test.localhost', sites_path='sites')" \
            "frappe.connect()" \
            "if not frappe.db.exists('Module Def', 'FDE Component'):" \
            "    frappe.get_doc({'doctype': 'Module Def', 'module_name': 'FDE Component', 'app_name': 'fde_component'}).insert(ignore_permissions=True)" \
            "    frappe.db.commit()" \
            "for dt in ['SyncJob', 'SyncJobDedup', 'SyncJobDLQ', 'SyncJobCheckpoint', 'SyncSchedule']:" \
            "    if frappe.db.exists('DocType', dt):" \
            "        frappe.db.set_value('DocType', dt, 'module', 'FDE Component')" \
            "frappe.db.commit()" \
            > /tmp/fix_module.py
          env/bin/python /tmp/fix_module.py

          bench --site test.localhost run-tests --app fde_component
