name: M2 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev default-mysql-client redis-server
          sudo service mariadb start
          sudo service redis-server start
          sleep 3

      - name: Install bench
        run: pip install frappe-bench -q

      - name: Initialize bench with Frappe v16
        run: |
          bench init --skip-redis-config-generation fde_bench
          cd fde_bench
          bench get-app frappe --branch version-16
          bench build

      - name: Create site
        run: |
          cd fde_bench
          bench new-site test.localhost \
            --mariadb-root-password test \
            --admin-password admin \
            --force

      - name: Install app and run tests
        run: |
          cd fde_bench
          cp -r ../fde_component apps/fde_component
          bench --site test.localhost install-app fde_component
          bench --site test.localhost run-tests --app fde_component
