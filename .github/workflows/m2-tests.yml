name: M2 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev mariadb-server mariadb-client redis-server
          sudo service mariadb start 2>/dev/null || sudo mysqld --user=root --datadir=/var/lib/mysql &
          sudo service redis-server start 2>/dev/null || sudo redis-server --daemonize yes
          sleep 5
          sudo mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'test'; FLUSH PRIVILEGES;" 2>/dev/null || true

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"

      - name: Set up bench
        run: |
          set -euo pipefail
          BENCH_DIR="$GITHUB_WORKSPACE/fde_bench"
          PY="$BENCH_DIR/env/bin/python"
          pip install -q "frappe-bench==5.31.0"
          bench init --skip-redis-config-generation "$BENCH_DIR"
          rm -rf "$BENCH_DIR/apps/frappe"
          git clone https://github.com/frappe/frappe.git "$BENCH_DIR/apps/frappe"
          cd "$BENCH_DIR/apps/frappe" && git checkout 012667b9c4e7f66d5e1ff5858d2e922331d4300a
          cd "$GITHUB_WORKSPACE"
          pip install -q -e "$BENCH_DIR/apps/frappe"
          "$PY" -m pip install -q whoosh pytest
          cp -r fde_component "$BENCH_DIR/apps/fde_component"

          # Build module subpackage in the CI copy so Frappe can import
          # fde_component.fde_component and find /doctypes/
          PKG="$BENCH_DIR/apps/fde_component/fde_component"
          mkdir -p "$PKG/fde_component"
          touch "$PKG/fde_component/__init__.py"
          ln -s ../doctypes "$PKG/fde_component/doctypes"

          # Build doctype/ as a real directory with shims for scrubbed names
          # and symlinks so Frappe's sync still finds the JSON files.
          PKG="$BENCH_DIR/apps/fde_component/fde_component"
          python3 "$GITHUB_WORKSPACE/.github/scripts/make_doctype_shims.py" "$PKG"

          "$PY" -m pip install -q -e "$BENCH_DIR/apps/fde_component"

          # Python 3.14 compatibility patch
          python3 "$GITHUB_WORKSPACE/.github/scripts/py314_patch.py"

          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -ptest --silent && break
            sleep 2
          done

          mkdir -p "$BENCH_DIR/sites" "$BENCH_DIR/logs" "$BENCH_DIR/sites/test.localhost/logs"
          printf "frappe\nfde_component\n" > "$BENCH_DIR/sites/apps.txt"
          "$BENCH_DIR/env/bin/bench" new-site test.localhost --mariadb-root-password test --admin-password admin --force

          # Pre-install import checks — surface path errors before install-app
          "$PY" "$GITHUB_WORKSPACE/.github/scripts/check_imports.py"

          "$BENCH_DIR/env/bin/bench" --site test.localhost install-app fde_component

      - name: Debug and conditionally migrate
        run: |
          BENCH_DIR="$GITHUB_WORKSPACE/fde_bench"
          cat -A "$BENCH_DIR/apps/fde_component/fde_component/modules.txt"
          ls -laR "$BENCH_DIR/apps/fde_component/fde_component/fde_component"
          EXISTS=$("$BENCH_DIR/env/bin/bench" --site test.localhost execute frappe.db.exists --args "['DocType','SyncJob']")
          echo "SyncJob exists: $EXISTS"
          if [ "$EXISTS" != "1" ] && [ "$EXISTS" != "True" ]; then
            echo "SyncJob missing - running migrate"
            "$BENCH_DIR/env/bin/bench" --site test.localhost migrate
          else
            echo "SyncJob present - skipping migrate"
          fi

      - name: Run tests
        run: |
          BENCH_DIR="$GITHUB_WORKSPACE/fde_bench"
          "$BENCH_DIR/env/bin/bench" --site test.localhost run-tests --app fde_component
