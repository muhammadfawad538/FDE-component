name: M2 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev mariadb-server mariadb-client redis-server
          sudo service mariadb start 2>/dev/null || sudo mysqld --user=root --datadir=/var/lib/mysql &
          sudo service redis-server start 2>/dev/null || sudo redis-server --daemonize yes
          sleep 5

      - name: Install bench
        run: pip install frappe-bench -q

      - name: Initialize bench with Frappe v16
        run: |
          bench init --skip-redis-config-generation fde_bench
          cd fde_bench
          bench get-app frappe --branch version-16
          bench build

      - name: Create site
        run: |
          cd fde_bench
          # Wait for MariaDB to be ready
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -ptest --silent && break
            echo "Waiting for MariaDB... ($i)"
            sleep 2
          done
          bench new-site test.localhost \
            --mariadb-root-password test \
            --admin-password admin \
            --force

      - name: Install app and run tests
        run: |
          cd fde_bench
          cp -r ../fde_component apps/fde_component
          # Patch Python 3.12 compatibility in Frappe
          python3 -c "
          with open('apps/frappe/frappe/utils/__init__.py', 'r') as f:
              content = f.read()
          content = content.replace('if key in v:', 'if hasattr(v, \"__contains__\") and key in v:')
          with open('apps/frappe/frappe/utils/__init__.py', 'w') as f:
              f.write(content)
          print('Patched')
          "
          bench --site test.localhost install-app fde_component
          bench --site test.localhost run-tests --app fde_component
