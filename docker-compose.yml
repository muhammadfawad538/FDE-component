services:
  mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-utest", "-ptest"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bench:
    image: frappe/bench:latest
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: test
      DB_PASSWORD: test
      REDIS_CACHE: redis:6379
      REDIS_QUEUE: redis:6379
      REDIS_SOCKETIO: redis:6379
      SITE_NAME: test.localhost
      ADMIN_PASSWORD: admin
    volumes:
      - ./fde_component:/home/frappe/bench/apps/fde_component:rw
      - bench_data:/home/frappe/bench
    init: true
    entrypoint: ["/bin/bash", "/setup.sh"]

volumes:
  mariadb_data:
  bench_data:
